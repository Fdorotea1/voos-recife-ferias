name: Gerar áudio Raquel Neural da Tabuada

on:
  push:
    branches: [tabuada-quest]
    paths:
      - '.github/workflows/raquel_audio.yml'
      - 'scripts/build_raquel.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout do ramo da aplicação
        uses: actions/checkout@v4
        with:
          ref: tabuada-quest
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar motor TTS
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Gerar MP3 com Raquel Neural pt-PT
        run: python scripts/build_raquel.py
      - name: Publicar áudios no mesmo ramo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tabuada-quest/audio/raquel/
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar áudio pt-PT RaquelNeural à Montanha da Tabuada"
            git push origin HEAD:tabuada-quest
          fi
